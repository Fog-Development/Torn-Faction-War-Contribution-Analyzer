[workspace]
resolver = "2"
members = [
    "crates/twr-core",
    "crates/twr-report",
    "crates/twr-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Justin V"]
license = "MIT"
repository = "https://github.com/justinv/torn-faction-war-contribution-analyzer"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
toml = "0.8"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
globset = "0.4"
rust_xlsxwriter = "0.79"
assert_cmd = "2.0"
predicates = "3.1"
insta = { version = "1.39", features = ["yaml"] }
tempfile = "3.10"

twr-core = { path = "crates/twr-core" }
twr-report = { path = "crates/twr-report" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
